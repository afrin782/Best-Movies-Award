<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Edit Movie</title>
</head>
<body>

    <h1>Edit Award Winning Movie</h1>

    <form action="/update" method="post">

        <input type="hidden" name="id" th:value="${movie.id}">

        <label>Movie Name:</label>
        <input type="text" name="movieName" th:value="${movie.movieName}" required>
        <br><br>

        <label>Language:</label>
        <input type="text" name="language" th:value="${movie.language}" required>
        <br><br>

        <label>Award Category:</label>
        <input type="text" name="awardCategory" th:value="${movie.awardCategory}" required>
        <br><br>

        <label>Director:</label>
        <input type="text" name="director" th:value="${movie.director}" required>
        <br><br>

        <label>Actor:</label>
        <input type="text" name="actor" th:value="${movie.actor}">
        <br><br>

        <label>Award Year:</label>
        <input type="number" name="awardYear" th:value="${movie.awardYear}" required>
        <br><br>

        <button type="submit">Update Movie</button>

    </form>

    <br>

    <a href="/">Back to Movies</a>

</body>
</html>
