<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>Award Winning Movies</title>

    <style>
        table {
            border-collapse: collapse;
            width: 100%;
        }

        th, td {
            border: 1px solid black;
            padding: 6px 10px;
            text-align: center;
        }

        th {
            background-color: #f2f2f2;
        }

        a {
            text-decoration: none;
        }
    </style>
</head>

<body>

    <h1>2026 Award Winning Movies</h1>

    <a href="/add">Add New Movie</a>

    <br><br>

    <table>

        <thead>
            <tr>
                <th>ID</th>
                <th>Movie Name</th>
                <th>Language</th>
                <th>Award Category</th>
                <th>Director</th>
                <th>Actor</th>
                <th>Award Year</th>
                <th>Actions</th>
            </tr>
        </thead>

        <tbody>

            <tr th:each="movie : ${movies}">

                <td th:text="${movie.id}"></td>
                <td th:text="${movie.movieName}"></td>
                <td th:text="${movie.language}"></td>
                <td th:text="${movie.awardCategory}"></td>
                <td th:text="${movie.director}"></td>
                <td th:text="${movie.actor}"></td>
                <td th:text="${movie.awardYear}"></td>

                <td>
                    <a th:href="@{/edit/{id}(id=${movie.id})}">Edit</a>
                    |
                    <a th:href="@{/delete/{id}(id=${movie.id})}"
                       onclick="return confirm('Are you sure you want to delete this movie?')">
                        Delete
                    </a>
                </td>

            </tr>

        </tbody>

    </table>

</body>

</html>
